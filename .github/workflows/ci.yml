name: CampusJob CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-gate:
    name: Lint, Typecheck, Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campusjob_test
          POSTGRES_USER: campusjob
          POSTGRES_PASSWORD: campusjob_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campusjob:campusjob_password@localhost:5432/campusjob_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_for_automated_testing_only_32chars
      JWT_REFRESH_SECRET: ci_refresh_secret_for_automated_testing_only_32chars
      API_PORT: 8080
      WEB_PORT: 3000
      WEB_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      SMTP_HOST: localhost
      SMTP_PORT: 1026
      SMTP_FROM: no-reply@campusjob.local
      MAILPIT_WEB_PORT: 8026
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: ./var/uploads
      MAX_UPLOAD_SIZE_MB: 10
      MAINTENANCE_SECRET: ci_maintenance_secret_for_test_environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Validate
        run: pnpm --filter @campusjob/api exec prisma validate

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Prisma Migrate Deploy on CI Database
        run: pnpm db:deploy

      - name: Run Linters
        run: pnpm lint

      - name: Run Typechecks
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Run E2E Healthcheck Tests
        run: pnpm test:e2e

      - name: Build Monorepo Artifacts
        run: pnpm build
