name: campusjob-official

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusjob}
      POSTGRES_USER: ${POSTGRES_USER:-campusjob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusjob_dev}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-campusjob} -d ${POSTGRES_DB:-campusjob}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.18
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1026}:1025"
      - "${MAILPIT_WEB_PORT:-8026}:8025"

volumes:
  postgres_data: